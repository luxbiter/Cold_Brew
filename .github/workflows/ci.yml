name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build toolchain image
        run: docker build . -t cold-brew-builder
      - name: Build plugin
        run: docker run --rm -v "${PWD}:/project" cold-brew-builder make
      - uses: actions/upload-artifact@v4
        with:
          name: cold_brew
          path: cold_brew.wps
